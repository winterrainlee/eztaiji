name: mobile practice review verify

on:
  push:
    branches:
      - review/mobile-practice-v1-20261003

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/mobile-practice-v1-20261003
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: node --test tests/preparation-pair.test.mjs
      - name: Diagnose state preservation
        run: |
          python - <<'PY'
          import json
          from scripts.check_preparation_pair import parse_json, SOURCE, convert
          source=parse_json(SOURCE.read_text(encoding='utf-8'))
          deployed=convert(source)
          sid='p003-m16-end'
          expected={field:source['states'][sid][field] for field in ['id','coordinateFrameId','feet','center','body','arms']}
          actual=deployed['states'][sid]
          def walk(a,b,path=''):
              if type(a) != type(b):
                  print('TYPE',path,type(a).__name__,type(b).__name__,repr(a),repr(b)); return True
              if isinstance(a,dict):
                  if a.keys()!=b.keys(): print('KEYS',path,a.keys(),b.keys()); return True
                  for k in a:
                      if walk(a[k],b[k],path+'/'+k): return True
              elif isinstance(a,list):
                  if len(a)!=len(b): print('LEN',path,len(a),len(b)); return True
                  for i,(x,y) in enumerate(zip(a,b)):
                      if walk(x,y,path+f'/{i}'): return True
              elif a!=b:
                  print('VALUE',path,repr(a),repr(b)); return True
              return False
          print('equal=',expected==actual)
          walk(expected,actual)
          PY
      - run: python -m unittest discover -s tests -p 'test_preparation_schemas.py' -v
      - run: python scripts/check_preparation_pair.py --emit
      - run: node --check published/assets/app.js
      - run: git diff --check
      - name: Regenerate deployment data
        run: cp .build/preparation/taiji-data.js published/data/taiji-data.js
      - name: Commit generated data when changed
        shell: bash
        run: |
          if git diff --quiet -- published/data/taiji-data.js; then
            echo "generated data already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/data/taiji-data.js
          git commit -m "Regenerate deployment data"
          git push
