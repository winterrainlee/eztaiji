name: mobile practice review verify

on:
  push:
    branches:
      - review/mobile-practice-v1-20261003

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/mobile-practice-v1-20261003
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: node --test tests/preparation-pair.test.mjs
      - run: python -m unittest discover -s tests -p 'test_preparation_schemas.py' -v
      - run: python scripts/check_preparation_pair.py --emit
      - run: node --check published/assets/app.js
      - run: git diff --check
      - name: Regenerate deployment data
        run: cp .build/preparation/taiji-data.js published/data/taiji-data.js
      - name: Commit generated data when changed
        shell: bash
        run: |
          if git diff --quiet -- published/data/taiji-data.js; then
            echo "generated data already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/data/taiji-data.js
          git commit -m "Regenerate deployment data"
          git push
