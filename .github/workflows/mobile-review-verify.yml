name: final mobile review verify

on:
  push:
    branches:
      - review/mobile-practice-v1-20261003

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/mobile-practice-v1-20261003
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: node --test tests/preparation-pair.test.mjs
      - run: python -m unittest discover -s tests -p 'test_preparation_schemas.py' -v
      - run: python scripts/check_preparation_pair.py --emit
      - run: cmp .build/preparation/taiji-data.js published/data/taiji-data.js
      - run: node --check published/assets/app.js
      - run: git diff --check
